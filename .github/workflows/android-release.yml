name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (format: v<upstream-version>.<fork-revision>, e.g. v4.6.0.0)"
        required: true
        type: string
      release_name:
        description: "Release title"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"
      - "android-v*"

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Run prepublish check
        run: |
          bash scripts/prepublish_check.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT}" > local.properties
          ./gradlew --no-daemon assembleRelease

      - name: Validate release tag format
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s\n' "$TAG" | grep -Eq '^(android-)?v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$'; then
            echo "Invalid release tag format: $TAG"
            echo "Expected format: v<upstream-version>.<fork-revision> (example: v4.6.0.0)"
            exit 1
          fi

      - name: Prepare release asset
        id: asset
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#android-}"
          export VERSION
          APK_ASSET="multi-agent-shognate-android-${VERSION}.apk"
          PACKAGE_TGZ_ASSET="multi-agent-shognate-package.tar.gz"
          PACKAGE_ZIP_ASSET="multi-agent-shognate-package.zip"
          VERSIONED_PACKAGE_TGZ_ASSET="multi-agent-shognate-package-${VERSION}.tar.gz"
          VERSIONED_PACKAGE_ZIP_ASSET="multi-agent-shognate-package-${VERSION}.zip"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${APK_ASSET}"
          git fetch --force --tags origin "+refs/tags/*:refs/tags/*"
          git archive --format=tar.gz --prefix=multi-agent-shognate/ "$TAG" -o "dist/${PACKAGE_TGZ_ASSET}"
          git archive --format=zip --prefix=multi-agent-shognate/ "$TAG" -o "dist/${PACKAGE_ZIP_ASSET}"
          cp "dist/${PACKAGE_TGZ_ASSET}" "dist/${VERSIONED_PACKAGE_TGZ_ASSET}"
          cp "dist/${PACKAGE_ZIP_ASSET}" "dist/${VERSIONED_PACKAGE_ZIP_ASSET}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_asset=${APK_ASSET}" >> "$GITHUB_OUTPUT"
          echo "package_tgz_asset=${PACKAGE_TGZ_ASSET}" >> "$GITHUB_OUTPUT"
          echo "package_zip_asset=${PACKAGE_ZIP_ASSET}" >> "$GITHUB_OUTPUT"
          echo "versioned_package_tgz_asset=${VERSIONED_PACKAGE_TGZ_ASSET}" >> "$GITHUB_OUTPUT"
          echo "versioned_package_zip_asset=${VERSIONED_PACKAGE_ZIP_ASSET}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: |
            dist/${{ steps.asset.outputs.apk_asset }}
            dist/${{ steps.asset.outputs.package_tgz_asset }}
            dist/${{ steps.asset.outputs.package_zip_asset }}
            dist/${{ steps.asset.outputs.versioned_package_tgz_asset }}
            dist/${{ steps.asset.outputs.versioned_package_zip_asset }}

      - name: Delete existing release assets for tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ steps.asset.outputs.tag }}`;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              for (const asset of release.assets) {
                core.info(`Deleting existing asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing release for ${tag}`);
              } else {
                throw error;
              }
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.asset.outputs.tag }}
          name: ${{ github.event.inputs.release_name || format('multi-agent-shognate {0}', steps.asset.outputs.version) }}
          files: |
            dist/${{ steps.asset.outputs.apk_asset }}
            dist/${{ steps.asset.outputs.package_tgz_asset }}
            dist/${{ steps.asset.outputs.package_zip_asset }}
            dist/${{ steps.asset.outputs.versioned_package_tgz_asset }}
            dist/${{ steps.asset.outputs.versioned_package_zip_asset }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease == true }}
          target_commitish: ${{ github.sha }}
