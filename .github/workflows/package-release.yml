name: Package Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (format: v<upstream-version>.<fork-revision>, e.g. v5.0.0.0)"
        required: true
        type: string
      release_name:
        description: "Release title"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3-venv

      - name: Setup Python venv with PyYAML
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r shogunate_mod/package/requirements.txt
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          SITE_PACKAGES="$("$PWD/.venv/bin/python" -c 'import site; print(site.getsitepackages()[0])')"
          echo "PYTHONPATH=$SITE_PACKAGES" >> $GITHUB_ENV

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/yohey-w/multi-agent-shogun.git
          git fetch --no-tags upstream main:refs/remotes/upstream/main

      - name: Run prepublish check
        run: |
          bash scripts/prepublish_check.sh

      - name: Validate release tag format
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$'; then
            echo "Invalid release tag format: $TAG"
            echo "Expected format: v<upstream-version>.<fork-revision> (example: v5.0.0.0)"
            exit 1
          fi

      - name: Prepare release packages
        id: asset
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG}"
          PACKAGE_TGZ_ASSET="multi-agent-shognate-package.tar.gz"
          PACKAGE_ZIP_ASSET="multi-agent-shognate-package.zip"
          VERSIONED_PACKAGE_TGZ_ASSET="multi-agent-shognate-package-${VERSION}.tar.gz"
          VERSIONED_PACKAGE_ZIP_ASSET="multi-agent-shognate-package-${VERSION}.zip"
          mkdir -p dist
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Release tag $TAG does not point to the checked prepublish commit."
            echo "tag:  $TAG_COMMIT"
            echo "HEAD: $HEAD_COMMIT"
            exit 1
          fi
          git archive --format=tar.gz --prefix=multi-agent-shognate/ HEAD -o "dist/${PACKAGE_TGZ_ASSET}"
          git archive --format=zip --prefix=multi-agent-shognate/ HEAD -o "dist/${PACKAGE_ZIP_ASSET}"
          cp "dist/${PACKAGE_TGZ_ASSET}" "dist/${VERSIONED_PACKAGE_TGZ_ASSET}"
          cp "dist/${PACKAGE_ZIP_ASSET}" "dist/${VERSIONED_PACKAGE_ZIP_ASSET}"
          {
            echo "## Install With cURL"
            echo
            echo "Install this exact release:"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/scripts/shogunate_package_bootstrap.sh | bash -s -- --version ${TAG}"
            echo '```'
            echo
            echo "This pins both the bootstrap script and package resolution to \`${TAG}\`."
            echo
            echo "For the latest release channel, use:"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/shogunate_package_bootstrap.sh | bash"
            echo '```'
            echo
          } > dist/release-notes.md
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_tgz_asset=${PACKAGE_TGZ_ASSET}" >> "$GITHUB_OUTPUT"
          echo "package_zip_asset=${PACKAGE_ZIP_ASSET}" >> "$GITHUB_OUTPUT"
          echo "versioned_package_tgz_asset=${VERSIONED_PACKAGE_TGZ_ASSET}" >> "$GITHUB_OUTPUT"
          echo "versioned_package_zip_asset=${VERSIONED_PACKAGE_ZIP_ASSET}" >> "$GITHUB_OUTPUT"
          echo "release_notes_path=dist/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Smoke cURL install package
        env:
          SHOGUNATE_PACKAGE_CURL_SMOKE_RUN_ID: package-curl-smoke-release-${{ github.run_id }}-${{ github.run_attempt }}
          SHOGUNATE_PACKAGE_CURL_SMOKE_PACKAGE: ${{ github.workspace }}/dist/${{ steps.asset.outputs.package_tgz_asset }}
        run: |
          make package-curl-smoke

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-release-assets
          path: |
            dist/${{ steps.asset.outputs.package_tgz_asset }}
            dist/${{ steps.asset.outputs.package_zip_asset }}
            dist/${{ steps.asset.outputs.versioned_package_tgz_asset }}
            dist/${{ steps.asset.outputs.versioned_package_zip_asset }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.asset.outputs.tag }}
          name: ${{ github.event.inputs.release_name || format('multi-agent-shognate {0}', steps.asset.outputs.version) }}
          files: |
            dist/${{ steps.asset.outputs.package_tgz_asset }}
            dist/${{ steps.asset.outputs.package_zip_asset }}
            dist/${{ steps.asset.outputs.versioned_package_tgz_asset }}
            dist/${{ steps.asset.outputs.versioned_package_zip_asset }}
          body_path: ${{ steps.asset.outputs.release_notes_path }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease == true }}
          target_commitish: ${{ steps.asset.outputs.tag }}
