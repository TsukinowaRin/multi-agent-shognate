current_core_touchpoints:
  - path: instructions/
    reason: "Generated prompt outputs and root compatibility copies remain at historical paths consumed by CLI adapters and docs."
    next_step: "Keep Shogunate prompt source ownership in shogunate_mod/instructions/source and keep root instructions limited to generated/compatibility outputs."
  - path: .opencode/agents/
    reason: "OpenCode agent definitions are generated root files consumed directly by OpenCode."
    next_step: "Keep generated outputs at the OpenCode-required root path while retaining source templates, generation rules, and freshness checks in shogunate_mod/instructions."
  - path: .opencode/tools/
    reason: "OpenCode loads custom tools from this root path, while the Shogunate inbox state updater implementation is MOD-owned."
    next_step: "Keep root OpenCode tools synchronized as compatibility copies of shogunate_mod/opencode/tools/."
  - path: AGENTS.md
    reason: "Codex auto-load file is generated at the repository root and differs from upstream guidance."
    next_step: "Keep generated output at root, but keep generation rules and freshness checks in shogunate_mod/instructions."
  - path: README.md / README_ja.md
    reason: "GitHub and npm display these root docs, while Shogunate package install, cURL, cwd-first, and Pair guidance is MOD-owned."
    next_step: "Keep root README files synchronized as compatibility copies of shogunate_mod/docs/README*.md."
  - path: CHANGELOG.md / CONTRIBUTING.md / SECURITY.md
    reason: "GitHub and package consumers read these root community docs, while Shogunate release notes, contribution rules, and security guidance are MOD-owned."
    next_step: "Keep root community docs synchronized as compatibility copies of shogunate_mod/docs/."
  - path: LICENSE
    reason: "Repository and package consumers expect the upstream-compatible license text at the root."
    next_step: "Keep LICENSE as a root public metadata file unless upstream changes require a deliberate license review."
  - path: docs/philosophy.md
    reason: "Design philosophy documentation remains at the historical root docs path, while Shogunate-specific doctrine is MOD-owned."
    next_step: "Keep root docs/philosophy.md synchronized as a compatibility copy of shogunate_mod/docs/philosophy.md."
  - path: CLAUDE.md
    reason: "Claude Code auto-loads this root path, but Shogunate guidance source is now mirrored in shogunate_mod/instructions/autoload."
    next_step: "Keep root CLAUDE.md synchronized as a compatibility copy of shogunate_mod/instructions/autoload/CLAUDE.md."
  - path: .claude/settings.json
    reason: "Claude Code reads hook and spinner settings from this root path, while the Shogunate hook settings are MOD-owned."
    next_step: "Keep root .claude/settings.json synchronized as a compatibility copy of shogunate_mod/hooks/claude_settings.json."
  - path: .github/copilot-instructions.md
    reason: "Copilot auto-load file is generated at the GitHub-required root path."
    next_step: "Keep generated output at root, but keep generation rules and freshness checks in shogunate_mod/instructions."
  - path: agents/default/
    reason: "Kimi K2 auto-load files are generated at this root path, while Shogunate guidance source is MOD-owned."
    next_step: "Keep generated output at root, but keep generation rules and freshness checks in shogunate_mod/instructions."
  - path: android/
    reason: "Android Studio / Gradle workflows use this root project path, while Shogunate Android source is MOD-owned."
    next_step: "Keep root android/ synchronized as the compatibility working tree for shogunate_mod/mobile/android/."
  - path: .github/workflows/
    reason: "GitHub Actions requires active workflow files at this root path, while Shogunate workflow sources are MOD-owned."
    next_step: "Keep root workflows synchronized as compatibility copies of shogunate_mod/package/workflows/, but keep workflow files out of runtime release archives."
  - path: .github/FUNDING.yml
    reason: "GitHub reads funding metadata from this root path, while Shogunate repository metadata is MOD-owned."
    next_step: "Keep root funding metadata synchronized as a compatibility copy of shogunate_mod/github/FUNDING.yml, but keep funding metadata out of runtime release archives."
  - path: .gitmodules
    reason: "Git reads submodule metadata from this root path, while Shogunate development dependency metadata is MOD-owned."
    next_step: "Keep root .gitmodules synchronized as a compatibility copy of shogunate_mod/development/gitmodules, but keep development submodule metadata out of runtime release archives."
  - path: .gitattributes
    reason: "Git archive release packaging reads export-ignore and line-ending rules from this root path, while Shogunate package boundary rules are MOD-owned."
    next_step: "Keep root .gitattributes synchronized as a compatibility copy of shogunate_mod/package/gitattributes, but keep Git packaging metadata out of runtime release archives."
  - path: .gitignore
    reason: "Git ignore rules for MOD source whitelists and local runtime state are read from this root path, while the Shogunate package boundary policy is MOD-owned."
    next_step: "Keep root .gitignore synchronized as a compatibility copy of shogunate_mod/package/gitignore, but keep Git ignore metadata out of runtime release archives."
  - path: .gitleaks.toml
    reason: "Secret scanning tools expect this root config path, while Shogunate-specific allowlists and custom secret rules are MOD-owned."
    next_step: "Keep root .gitleaks.toml synchronized as a compatibility copy of shogunate_mod/security/gitleaks.toml."
  - path: package.json / package-lock.json / requirements.txt
    reason: "npm and Python tooling require package metadata/dependency files at the repository root, while the Shogunate package metadata source is MOD-owned."
    next_step: "Keep root package.json, package-lock.json, and requirements.txt synchronized as compatibility copies of shogunate_mod/package/package*.json and shogunate_mod/package/requirements.txt; keep package-lock files out of runtime release archives."
  - path: memory/ and saytask/
    reason: "User runtime state stays at the historical root paths, while first setup templates are MOD-owned."
    next_step: "Keep root sample files synchronized as compatibility copies of shogunate_mod/package/templates and keep generated private state ignored."
  - path: images/ and reports/
    reason: "Historical docs/demo assets and an empty root reports scaffold are not part of the runtime package surface."
    next_step: "Keep them out of release archives with export-ignore unless a future docs package explicitly needs them."
  - path: config/
    reason: "Tracked root config defaults remain at historical tool-facing paths, while local user runtime settings remain ignored and Shogunate config sources are MOD-owned."
    next_step: "Keep tracked root config defaults synchronized as compatibility copies of shogunate_mod/configure and shogunate_mod/notify sources; keep config/settings.yaml and config/projects.yaml local/runtime."
  - path: context/
    reason: "Project context files remain user/runtime state at the historical root path, while the context directory guide is MOD-owned."
    next_step: "Keep root context/README.md synchronized as a compatibility copy of shogunate_mod/context/README.md; keep project-specific context files local/runtime."
  - path: Makefile
    reason: "make reads the default development command surface from the repository root, while Shogunate-specific build/test/CoDD targets are MOD-owned."
    next_step: "Keep root Makefile synchronized as a compatibility copy of shogunate_mod/development/Makefile."
  - path: .codd/codd.yaml
    reason: "CoDD tooling expects this root config path, but the Shogunate-specific config source is MOD-owned."
    next_step: "Keep this compatibility copy synchronized with shogunate_mod/gunkan/codd.yaml."
  - path: docs/codd/
    reason: "CoDD frontmatter/design docs remain under root docs for readers and graph tooling, while Gunkan/CoDD design content is MOD-owned."
    next_step: "Keep root docs/codd synchronized as compatibility copies of shogunate_mod/gunkan/docs/."
  - path: docs/AGMSG_BRIDGE_DESIGN.md
    reason: "The agmsg transport bridge design and verification record stays under root docs for readers, while the bridge design source is MOD-owned next to the transport implementation."
    next_step: "Keep root docs/AGMSG_BRIDGE_DESIGN.md synchronized as a compatibility copy of shogunate_mod/docs/AGMSG_BRIDGE_DESIGN.md."
  - path: skills/ and .cursor/skills/
    reason: "Claude Code and Cursor load skills from root-compatible paths, while Shogunate skill sources are MOD-owned."
    next_step: "Keep root skill directories synchronized as compatibility copies of shogunate_mod/skills/."
  - path: templates/
    reason: "Karo integration instructions reference the historical root templates path, while the reusable integration templates are Shogunate-owned."
    next_step: "Keep root templates synchronized as compatibility copies of shogunate_mod/templates/."
  - path: tests/
    reason: "Root test runners consume top-level, unit, and E2E test paths directly, while Shogunate-specific test behavior is MOD-owned."
    next_step: "Keep root tests synchronized as compatibility copies of shogunate_mod/tests/, but keep both test trees out of runtime npm packages and release archives."
target_direction:
  - "Keep upstream-like runtime entrypoints thin."
  - "Move Shogunate-only behavior into shogunate_mod/ first."
  - "Leave compatibility wrappers at historical paths."
